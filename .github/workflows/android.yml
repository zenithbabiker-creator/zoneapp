name: Build Android Production App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Generate APK and AAB Packages
    runs-on: ubuntu-latest

    env:
      MYAPP_RELEASE_STORE_FILE: release-key.jks
      MYAPP_RELEASE_STORE_PASSWORD: zone2026
      MYAPP_RELEASE_KEY_ALIAS: zone-key
      MYAPP_RELEASE_KEY_PASSWORD: zone2026

    steps:
      # 1. جلب الأكواد الحديثة والمستندات من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا (JDK 21) مع كاش Gradle
      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      # 3. إعداد بيئة Node.js مع كاش npm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 4. تثبيت مكتبات وحزم المشروع الأساسية
      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      # 5. بناء كود الويب
      - name: Build Web Application
        run: npm run build

      # 6. مزامنة ونقل كود الويب إلى أندرويد
      - name: Sync Capacitor to Android Platform
        run: npx cap sync android

      # 7. استعادة والتحقق من مفتاح التوقيع الثابت والموحد
      - name: Decode and Restore Fixed Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/app/release-key.jks
          fi

          if [ ! -s android/app/release-key.jks ]; then
            echo "Keystore file is missing or 0 bytes. Generating fallback release-key.jks..."
            keytool -genkey -v -keystore android/app/release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias zone-key -storepass zone2026 -keypass zone2026 \
              -dname "CN=Zone, OU=Agri, O=Kilimanjaro, L=Omdurman, S=Khartoum, C=SD"
          else
            echo "Verified valid release-key.jks ($(wc -c < android/app/release-key.jks) bytes)."
          fi

      # 8. تطبيق الإعدادات وتزييد الإصدار تلقائياً (3.x)
      - name: Enforce Compatible Configuration and Update Version
        run: |
          if ! grep -q "subprojects" android/build.gradle; then
            cat << 'EOF' >> android/build.gradle

  subprojects {
      configurations.all {
          resolutionStrategy.force 'androidx.core:core-ktx:1.13.1'
          resolutionStrategy.force 'androidx.core:core:1.13.1'
      }
  }
  EOF
          fi

          TARGET_VERSION_CODE="${{ github.run_number }}"
          TARGET_VERSION_NAME="3.${{ github.run_number }}"

          if [ -f android/app/build.gradle ]; then
            sed -i "s/versionCode .*/versionCode $TARGET_VERSION_CODE/g" android/app/build.gradle
            sed -i "s/versionName .*/versionName \"$TARGET_VERSION_NAME\"/g" android/app/build.gradle
            echo "Updated Android Build Version to Code: $TARGET_VERSION_CODE, Name: $TARGET_VERSION_NAME"
          fi

          cat << 'EOF' >> android/gradle.properties
          RELEASE_STORE_FILE=release-key.jks
          RELEASE_STORE_PASSWORD=zone2026
          RELEASE_KEY_ALIAS=zone-key
          RELEASE_KEY_PASSWORD=zone2026
          EOF

          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/g' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle
          fi

          chmod +x android/gradlew

      # 9. معالجة وتطبيق أيقونة التطبيق الرسمية وشاشات البداية
      - name: Process, Pad, and Deploy Main Branded Icon
        run: |
          echo "Installing ImageMagick system utilities..."
          sudo apt-get update && sudo apt-get install -y imagemagick

          if [ -f "icon.png" ]; then
            echo "Found icon.png"
          elif [ -f "icon.jpg" ]; then
            convert icon.jpg icon.png
          elif [ -f "public/logo.png" ]; then
            cp public/logo.png icon.png
          elif [ -f "logo.jpg" ]; then
            convert logo.jpg icon.png
          else
            echo "Generating fallback default icon..."
            convert -size 512x512 xc:"#2E7D32" -fill "#FFFFFF" -font "DejaVu-Sans-Bold" -gravity center -pointsize 180 -draw "text 0,0 'Z'" icon.png
          fi

          echo "Processing icon.png for production..."
          convert icon.png -resize 384x384 -gravity center -background "#FFFFFF" -extent 512x512 -strip png24:master_clean.png

          deploy_icon_dimension() {
            local folder_name="$1"
            local dimension="$2"
            local target_dir="android/app/src/main/res/$folder_name"

            mkdir -p "$target_dir"
            echo "Injecting padded binary icons into $folder_name (${dimension}x${dimension})..."

            convert master_clean.png -resize ${dimension}x${dimension} -strip png24:"$target_dir/ic_launcher.png"
            convert master_clean.png -resize ${dimension}x${dimension} -strip png24:"$target_dir/ic_launcher_round.png"
            convert master_clean.png -resize ${dimension}x${dimension} -strip png24:"$target_dir/ic_launcher_foreground.png"

            chmod 664 "$target_dir"/ic_launcher*.png
          }

          deploy_icon_dimension "mipmap-mdpi" 48
          deploy_icon_dimension "mipmap-hdpi" 72
          deploy_icon_dimension "mipmap-xhdpi" 96
          deploy_icon_dimension "mipmap-xxhdpi" 144
          deploy_icon_dimension "mipmap-xxxhdpi" 192

          find android/app/src/main/res/ -name "splash.png" 2>/dev/null | while read -r splash; do
            if [ -f "$splash" ]; then
              convert -size 1080x1920 xc:"#FFFFFF" -gravity center -draw "image over 0,-150 300,300 'master_clean.png'" -fill "#2E7D32" -font "DejaVu-Sans-Bold" -pointsize 50 -gravity center -draw "text 0,200 'زون للخدمات الزراعية'" -strip png24:temp_splash.png
              rm -f "$splash"
              mkdir -p "$(dirname "$splash")"
              mv temp_splash.png "$splash"
              chmod 664 "$splash"
            fi
          done

          rm -f master_clean.png
          echo "android.crunchPngs=false" >> android/gradle.properties

      # 10. تنظيف الكاش والبيئة عبر Gradle Wrapper
      - name: Clean Gradle Build Cache
        run: ./gradlew clean
        working-directory: ./android

      # 11. بناء وتجميع ملف APK التجريبي
      - name: Compile and Build APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ./android

      # 12. بناء وتجميع حزمة AAB الموقعة للإنتاج
      - name: Compile and Build App Bundle (AAB)
        run: ./gradlew bundleRelease --stacktrace
        working-directory: ./android

      # 13. حفظ ورفع ملف الـ APK
      - name: Archive and Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoogleStudio-App-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 14. حفظ ورفع حزمة الـ AAB الموقعة
      - name: Archive and Upload Signed AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoogleStudio-App-Production-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
